<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts serve 100% of text; without preload they are discovered only
       after the CSS parses, so every first paint flashes. `crossorigin` is
       required for fonts even same-origin. Arabic subset loads first: it
       covers the entire UI copy. -->
    <link rel="preload" href="/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Boot: theme, motion, glass tier, lens gate (external: Vercel CSP
       is script-src 'self' — inline would be blocked in production).
       Blocking on purpose: runs before first paint. -->
    <script src="/boot.js"></script>
    <title>آزمون‌ساز | سامانه مدیریت آزمون آنلاین</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction — the lens bend. Consumed by the panel's OWN
       backdrop-filter (.glx / .glx-strong / .glx-dark, gated on
       html[data-lens='on'] in index.css):
       backdrop-filter: blur() saturate() url('#lg-lens').
       ORDER MATTERS: the bend runs LAST, over the already-blurred backdrop.

       THE MAP — /public/lens-map.png, generated by tools. A radial Chebyshev
       lens: exact (128,128) neutral interior (zero displacement), 4-fold
       symmetric by construction — left/right/bottom/top all pull, corners pull
       diagonally. Replaces the previous two in-SVG data-URI gradients merged
       inside the filter, which rendered right-edge-only on Chromium >138.
       scale 28 → max ±14px pull at the extreme rim = Apple's measured ceiling
       (their band is 8–14px; user spec: match it exactly). Rim-zone width is
       the outer 18% of the panel. Filter
       region is clipped to the ELEMENT BOX so the map is sampled on the same
       rounded geometry the panel clips to. EXACTLY ONE #lg-lens per page. -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0" >
      <defs>
        <filter id="lg-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="/lens-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- panel-lens — Type A/B material, the FULL kube.io chain,
             byte-for-byte the playground's renderFilter() (light theme):

               displaced  -> saturate ring (feColorMatrix values=5)
                           -> RGB dim (per-channel linear, --panel-lens-dim)
             spec layer   -> feComposite 'in' (ring-shaped saturation)
                           -> feFuncA slope (--panel-lens-spec-opacity)
                           -> two feBlend 'normal' composites

             Geometry and params PARSE from the --panel-lens-* tokens in
             src/index.css (bezel 14, thickness 72, radius 21, 326x64 at
             2x). scale 43.67 = --panel-lens-max-displacement -> +-21.8px
             peak pull (approved playground number; head-smoothed profile
             normalizes to 40.35 internally — normalization only).
             Blur stays in the CSS chain (blur() == feGaussianBlur, same
             op, same position: BEFORE displacement) so A/B keep their own
             blur tokens with one shared filter.
             Box-clipped: the % feImage resolves against the region, so
             the region MUST equal the element box (same contract as
             #lg-lens). EXACTLY ONE #panel-lens and ONE #panel-lens-dark. -->
        <filter id="panel-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="/panel-lens-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="displacement_map"/>
          <feDisplacementMap in="SourceGraphic" in2="displacement_map" scale="43.67" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feColorMatrix in="displaced" type="saturate" values="5" result="displaced_saturated"/>
          <feComponentTransfer in="displaced" result="rgb_dimmed">
            <feFuncR type="linear" slope="0.8500" intercept="0.0606"/>
            <feFuncG type="linear" slope="0.8421" intercept="0.0619"/>
            <feFuncB type="linear" slope="0.7789" intercept="0.0971"/>
          </feComponentTransfer>
          <feComponentTransfer in="displaced_saturated" result="saturated_dimmed">
            <feFuncR type="linear" slope="0.8500" intercept="0.0606"/>
            <feFuncG type="linear" slope="0.8421" intercept="0.0619"/>
            <feFuncB type="linear" slope="0.7789" intercept="0.0971"/>
          </feComponentTransfer>
          <feImage href="/panel-specular-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="specular_layer"/>
          <feComposite in="saturated_dimmed" in2="specular_layer" operator="in" result="specular_saturated"/>
          <feComponentTransfer in="specular_layer" result="specular_faded">
            <feFuncA type="linear" slope="0.34"/>
          </feComponentTransfer>
          <feBlend in="specular_saturated" in2="rgb_dimmed" mode="normal" result="withSaturation"/>
          <feBlend in="specular_faded" in2="withSaturation" mode="normal"/>
        </filter>
        <!-- dark theme: identical chain, dim from --panel-lens-dim (0.06) -->
        <filter id="panel-lens-dark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="/panel-lens-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="displacement_map"/>
          <feDisplacementMap in="SourceGraphic" in2="displacement_map" scale="43.67" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feColorMatrix in="displaced" type="saturate" values="5" result="displaced_saturated"/>
          <feComponentTransfer in="displaced" result="rgb_dimmed">
            <feFuncR type="linear" slope="0.9400" intercept="0.0242"/>
            <feFuncG type="linear" slope="0.9368" intercept="0.0248"/>
            <feFuncB type="linear" slope="0.9116" intercept="0.0388"/>
          </feComponentTransfer>
          <feComponentTransfer in="displaced_saturated" result="saturated_dimmed">
            <feFuncR type="linear" slope="0.9400" intercept="0.0242"/>
            <feFuncG type="linear" slope="0.9368" intercept="0.0248"/>
            <feFuncB type="linear" slope="0.9116" intercept="0.0388"/>
          </feComponentTransfer>
          <feImage href="/panel-specular-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="specular_layer"/>
          <feComposite in="saturated_dimmed" in2="specular_layer" operator="in" result="specular_saturated"/>
          <feComponentTransfer in="specular_layer" result="specular_faded">
            <feFuncA type="linear" slope="0.34"/>
          </feComponentTransfer>
          <feBlend in="specular_saturated" in2="rgb_dimmed" mode="normal" result="withSaturation"/>
          <feBlend in="specular_faded" in2="withSaturation" mode="normal"/>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
