<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts serve 100% of text; without preload they are discovered only
       after the CSS parses, so every first paint flashes. `crossorigin` is
       required for fonts even same-origin. Arabic subset loads first: it
       covers the entire UI copy. -->
    <link rel="preload" href="/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- LCP image on /login (chosen by the CSS image-set in .login-art).
       Browsers without AVIF skip decoding it and fall back via image-set. -->
    <link rel="preload" href="/login-education-light.avif" as="image" type="image/avif" />
    <script>
      (() => {
        const key = 'azmoonsaz-theme';
        let preference = 'system';
        try {
          const saved = localStorage.getItem(key);
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch {}
        const theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        const motionKey = 'azmoonsaz-motion';
        let motionPreference = 'system';
        try {
          const savedMotion = localStorage.getItem(motionKey);
          if (savedMotion === 'reduced' || savedMotion === 'full' || savedMotion === 'system') {
            motionPreference = savedMotion;
          }
        } catch {}
        const systemReducesMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const resolvedMotion =
          motionPreference === 'reduced' || systemReducesMotion ? 'reduce' : 'full';
        document.documentElement.dataset.motionPreference = motionPreference;
        document.documentElement.dataset.motion = resolvedMotion;

        // Material tier probe — resolved ONCE, before first paint. One of:
        //   full — every glass layer (modern GPUs)
        //   lite — blur-free tinted fill + rim + shadow (weak GPUs,
        //          prefers-reduced-transparency)
        //   off  — solid fills + borders (forced-colors, ≤2 GB devices)
        // The user's explicit choice (azmoonsaz-glass) always wins over the
        // probe; Apple never takes the Reduce Transparency switch away.
        const glassKey = 'azmoonsaz-glass';
        let glassOverride = null;
        try {
          const savedGlass = localStorage.getItem(glassKey);
          if (savedGlass === 'full' || savedGlass === 'lite' || savedGlass === 'off') {
            glassOverride = savedGlass;
          }
        } catch {}
        if (glassOverride) {
          document.documentElement.dataset.glass = glassOverride;
        } else {
          let tier = 'full';
          try {
            if (matchMedia('(forced-colors: active)').matches) tier = 'off';
            else if (matchMedia('(prefers-reduced-transparency: reduce)').matches) tier = 'lite';
            else {
              const cores = navigator.hardwareConcurrency ?? 4;
              const memory = navigator.deviceMemory ?? 8; // GB; Chromium only
              if (memory <= 2) tier = 'off';
              else if (cores < 4 || memory <= 4) tier = 'lite';
            }
          } catch {}
          document.documentElement.dataset.glass = tier;
        }
      })();
    </script>
    <title>آزمون‌ساز | سامانه مدیریت آزمون آنلاین</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction filter — consumed by .glass-edge::after via
       backdrop-filter: url('#lg-lens') (Chromium only; guarded by @supports in
       index.css). The displacement map is a stretched SVG gradient: R channel
       runs 0→1 horizontally, G channel 0→1 vertically (two screen-blended
       rects), so feDisplacementMap pulls the backdrop OUTWARD near the rim —
       the lens bend. preserveAspectRatio="none" + 100% geometry stretches the
       map to every panel's size, so one filter serves all surfaces.
       Keep this element in the DOM (display:none would kill the filter). -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0" >
      <defs>
        <filter id="lg-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage
            href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cdefs%3E%3ClinearGradient%20id='x'%20x1='0'%20y1='0'%20x2='1'%20y2='0'%3E%3Cstop%20offset='0'%20stop-color='%23000'/%3E%3Cstop%20offset='1'%20stop-color='%23f00'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='y'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23000'/%3E%3Cstop%20offset='1'%20stop-color='%230f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='160'%20height='160'%20fill='url(%23x)'/%3E%3Crect%20width='160'%20height='160'%20fill='url(%23y)'%20style='mix-blend-mode:screen'/%3E%3C/svg%3E"
            x="0"
            y="0"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="map"
          />
          <feDisplacementMap in="SourceGraphic" in2="map" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
