<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts serve 100% of text; without preload they are discovered only
       after the CSS parses, so every first paint flashes. `crossorigin` is
       required for fonts even same-origin. Arabic subset loads first: it
       covers the entire UI copy. -->
    <link rel="preload" href="/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Boot: theme, motion, glass tier, lens gate (external: Vercel CSP
       is script-src 'self' — inline would be blocked in production).
       Blocking on purpose: runs before first paint. -->
    <script src="/boot.js"></script>
    <title>آزمون‌ساز | سامانه مدیریت آزمون آنلاین</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction — the lens bend. Consumed by the panel's OWN
       backdrop-filter, composed AT RUNTIME by src/glass/glassController.ts:
       backdrop-filter: blur() saturate() url('#lg-N').
       ORDER MATTERS: the bend runs LAST, over the already-blurred backdrop
       (playground order). Blur/saturate stay in the CSS chain (GPU) — the SVG
       chain only bends, saturates and rims.

       WHY NO STATIC FILTER HERE ANYMORE: (1) Chromium never loads external
       feImage hrefs inside backdrop-filter chains (the old /lens-map.png
       fallback silently rendered as a uniform whole-panel shift), and (2) a
       single pre-baked map stretched over every panel size displaces the
       whole panel instead of its rim. The engine builds correct per-geometry
       data-URI maps (edge-only displacement, real border-radius, specular rim)
       and SHARES one filter per unique geometry signature. Full evidence:
       docs/liquid-glass-engine-audit.md. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
