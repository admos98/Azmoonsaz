<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts serve 100% of text; without preload they are discovered only
       after the CSS parses, so every first paint flashes. `crossorigin` is
       required for fonts even same-origin. Arabic subset loads first: it
       covers the entire UI copy. -->
    <link rel="preload" href="/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- LCP image on /login (chosen by the CSS image-set in .login-art).
       Browsers without AVIF skip decoding it and fall back via image-set. -->
    <link rel="preload" href="/login-education-light.avif" as="image" type="image/avif" />
    <script>
      (() => {
        const key = 'azmoonsaz-theme';
        let preference = 'system';
        try {
          const saved = localStorage.getItem(key);
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch {}
        const theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        const motionKey = 'azmoonsaz-motion';
        let motionPreference = 'system';
        try {
          const savedMotion = localStorage.getItem(motionKey);
          if (savedMotion === 'reduced' || savedMotion === 'full' || savedMotion === 'system') {
            motionPreference = savedMotion;
          }
        } catch {}
        const systemReducesMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const resolvedMotion =
          motionPreference === 'reduced' || systemReducesMotion ? 'reduce' : 'full';
        document.documentElement.dataset.motionPreference = motionPreference;
        document.documentElement.dataset.motion = resolvedMotion;

        // Material tier probe — resolved ONCE, before first paint. One of:
        //   full — every glass layer (modern GPUs)
        //   lite — blur-free tinted fill + rim + shadow (weak GPUs,
        //          prefers-reduced-transparency)
        //   off  — solid fills + borders (forced-colors, ≤2 GB devices)
        // The user's explicit choice (azmoonsaz-glass) always wins over the
        // probe; Apple never takes the Reduce Transparency switch away.
        const glassKey = 'azmoonsaz-glass';
        let glassOverride = null;
        try {
          const savedGlass = localStorage.getItem(glassKey);
          if (savedGlass === 'full' || savedGlass === 'lite' || savedGlass === 'off') {
            glassOverride = savedGlass;
          }
        } catch {}
        if (glassOverride) {
          document.documentElement.dataset.glass = glassOverride;
        } else {
          let tier = 'full';
          try {
            if (matchMedia('(forced-colors: active)').matches) tier = 'off';
            else if (matchMedia('(prefers-reduced-transparency: reduce)').matches) tier = 'lite';
            else if ((navigator.deviceMemory ?? 8) <= 2) tier = 'off';
            // NOTE: the old hardware-sniffing downgrade (CPU core count and
            // device-memory heuristics → lite) is RETIRED.
            // navigator.deviceMemory reports 4 on many 16 GB machines (it is
            // capped and rounded), which silently stripped blur on perfectly
            // capable hardware — the app shipped as blurless tinted plastic
            // with no way to see why. Blur stays on unless the device really
            // cannot afford it or the user asks for less.
          } catch {}
          document.documentElement.dataset.glass = tier;
        }

        // Lens gate — SVG reference filters inside backdrop-filter only render
        // on Chromium >= 138. Older engines pass the SYNTAX probe
        // (CSS.supports('backdrop-filter', "url('#x')") === true) but silently
        // drop the whole declaration at paint time — including the blur that
        // was chained after it. Gating on version means the lens is purely
        // additive: every browser keeps blur() + saturate(), Chromium 138+
        // additionally bends the rim.
        try {
          const m = navigator.userAgent.match(/Chrom(?:e|ium)\/(\d+)/);
          const major = m ? parseInt(m[1], 10) : 0;
          document.documentElement.dataset.lens = major >= 138 ? 'on' : 'off';
        } catch {
          document.documentElement.dataset.lens = 'off';
        }
      })();
    </script>
    <title>آزمون‌ساز | سامانه مدیریت آزمون آنلاین</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction — the lens bend. Consumed by the panel's OWN
       backdrop-filter (.glx / .glx-strong / .glx-dark, gated on
       html[data-lens='on'] in index.css):
       backdrop-filter: blur() saturate() url('#lg-lens').
       ORDER MATTERS: the bend runs LAST, over the already-blurred backdrop.

       ARCHITECTURE (rebuilt after the chromatic-lens regression): the filter is
       ONE edge-weighted feDisplacementMap. The previous build isolated R/G/B
       into three displaced layers and re-summed them with feComposite
       arithmetic; in Chromium the summed layers concentrated the page's own
       saturated lines at the rim into thick neon brackets (the "thick lines"
       in the user's photos) and the out-of-bounds rim sampling smeared the
       backdrop, so the blurred image no longer matched the background. A
       single map with the SAME geometry is clean: the interior is 50% grey
       (identity — centre colour ≡ centre colour), and only the outer band
       displaces.

       THE MAP — two 1-channel ramps blended with feBlend screen:
         x-image: R channel only — 0 at the start edge, 50% grey plateau, 255
                  at the end edge (left→right pull).
         y-image: G channel only — the same ramp top→bottom.
       Screen of red-only and green-only = (R ramp, G ramp, 0): each axis is
       driven by exactly its own channel, so all four edges twist and corners
       bend diagonally like a real lens.

       RAMP WIDTH — 12%: content merely NEAR the edge (not touching it) is
       pulled into the rim (user spec: "all items close to edges … should be
       reflected on the rim"). The plateau holds from 12%..88%, so the centre
       stays a pure, precise blur that matches the background one-to-one.

       scale 26 → max ±13px pull at the extreme edge: the rim visibly twists
       the background without smearing the panel's read.

       The filter region is CLIPPED TO THE ELEMENT BOX (x/y/width/height all
       0/0/100%) so the map is sampled on the same rounded-rect geometry the
       panel clips to. Keep this element in the DOM (display:none would kill
       the filter). There must be EXACTLY ONE #lg-lens in the document. -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0" >
      <defs>
        <filter id="lg-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage
            href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3ClinearGradient%20id='x'%20x1='0'%20y1='0'%20x2='1'%20y2='0'%3E%3Cstop%20offset='0'%20stop-color='%23000'/%3E%3Cstop%20offset='0.12'%20stop-color='%23800000'/%3E%3Cstop%20offset='0.88'%20stop-color='%23800000'/%3E%3Cstop%20offset='1'%20stop-color='%23f00'/%3E%3C/linearGradient%3E%3Crect%20width='160'%20height='160'%20fill='url(%23x)'/%3E%3C/svg%3E"
            x="0"
            y="0"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="mapX"
          />
          <feImage
            href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3ClinearGradient%20id='y'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23000'/%3E%3Cstop%20offset='0.12'%20stop-color='%23008000'/%3E%3Cstop%20offset='0.88'%20stop-color='%23008000'/%3E%3Cstop%20offset='1'%20stop-color='%230f0'/%3E%3C/linearGradient%3E%3Crect%20width='160'%20height='160'%20fill='url(%23y)'/%3E%3C/svg%3E"
            x="0"
            y="0"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="mapY"
          />
          <feBlend in="mapX" in2="mapY" mode="screen" result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="26" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
