<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Fonts serve 100% of text; without preload they are discovered only
       after the CSS parses, so every first paint flashes. `crossorigin` is
       required for fonts even same-origin. Arabic subset loads first: it
       covers the entire UI copy. -->
    <link rel="preload" href="/fonts/vazirmatn-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Boot: theme, motion, glass tier, lens gate (external: Vercel CSP
       is script-src 'self' — inline would be blocked in production).
       Blocking on purpose: runs before first paint. -->
    <script src="/boot.js"></script>
    <title>آزمون‌ساز | سامانه مدیریت آزمون آنلاین</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid-glass refraction — the lens bend. Consumed by the panel's OWN
       backdrop-filter (.glx / .glx-strong / .glx-dark, gated on
       html[data-lens='on'] in index.css):
       backdrop-filter: blur() saturate() url('#lg-lens').
       ORDER MATTERS: the bend runs LAST, over the already-blurred backdrop.

       THE MAP — /public/lens-map.png, generated by tools. A radial Chebyshev
       lens: exact (128,128) neutral interior (zero displacement), 4-fold
       symmetric by construction — left/right/bottom/top all pull, corners pull
       diagonally. Replaces the previous two in-SVG data-URI gradients merged
       inside the filter, which rendered right-edge-only on Chromium >138.
       scale 28 → max ±14px pull at the extreme rim = Apple's measured ceiling
       (their band is 8–14px; user spec: match it exactly). Rim-zone width is
       the outer 18% of the panel. Filter
       region is clipped to the ELEMENT BOX so the map is sampled on the same
       rounded geometry the panel clips to. EXACTLY ONE #lg-lens per page. -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0" >
      <defs>
        <filter id="lg-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="/lens-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- panel-lens — the Type A/B bend: Snell/squircle displacement,
             the kube.io methodology. Map /public/panel-lens-map.png from
             tools/gen-panel-lens.py, which PARSES the geometry from the
             --panel-lens-* tokens in src/index.css (bezel 14, thickness 72,
             radius 21, 326x64 raster at 2x; convex squircle, n1=1 → n2=1.5,
             smoothed profile head, border at peak decaying inward).
             scale 43.67 = --panel-lens-max-displacement → ±21.8px peak
             pull at the border (the approved playground number; the
             head-smoothed profile normalizes to 40.35 internally — the
             normalization cancels out, only the shape is smoother).
             Box-clipped to the element; blur()/saturate() run BEFORE it
             (the bend is last). EXACTLY ONE #panel-lens per page. -->
        <filter id="panel-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="/panel-lens-map.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="43.67" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
