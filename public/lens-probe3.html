<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens probe v3 — azmoon (app background, draggable)</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  body{
    /* the REAL app plate — same file the app paints behind its panels */
    background: url('/backgrounds/bg-d-light.svg') center / cover no-repeat fixed #f2efe8;
    min-height:100vh; overflow:hidden;
  }
  body.stripes{
    /* control mode: hard B/W stripes to expose one-side/axis artifacts */
    background: repeating-linear-gradient(90deg, #111 0 6px, #fff 6px 12px);
  }
  #hud{
    position:fixed; top:10px; right:10px; z-index:10; direction:ltr;
    font:12px/1.5 ui-monospace,monospace; background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.2); border-radius:10px; padding:10px 12px; color:#111;
    display:flex; flex-direction:column; gap:6px;
  }
  #hud button{font:600 12px system-ui; padding:4px 8px; cursor:pointer}
  #hud label{display:flex; gap:6px; align-items:center; font:12px ui-monospace,monospace}
  #panel{
    position:fixed; width:340px; height:220px; border-radius:26px;
    top:120px; left:120px; cursor:grab; touch-action:none;
    border:1px solid rgba(26,26,46,.25);
    background:rgba(255,255,255,.10);          /* the app's frost level */
    backdrop-filter: blur(10px) saturate(1.5) url('#v3-lens');  /* bend LAST, like the app */
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 12px -6px rgba(255,255,255,.2);
  }
  #panel:active{cursor:grabbing}
  #panel .tag{position:absolute; bottom:8px; right:12px; font:600 11px system-ui; color:#333; pointer-events:none}
  #report{position:fixed; bottom:10px; left:10px; z-index:10; direction:ltr;
    white-space:pre; font:11px/1.4 ui-monospace,monospace; background:#fff; color:#111;
    padding:8px 10px; border-radius:8px; max-width:640px}
</style>
</head>
<body>
<div id="hud">
  <b>lens probe v3</b>
  <button id="mode">toggle background (plate / stripes)</button>
  <label>scale <input id="scale" type="range" min="0" max="80" value="40" step="1"> <span id="scalev">40</span></label>
  <label>edge% <input id="edge" type="range" min="6" max="45" value="18" step="1"> <span id="edgev">18</span></label>
  <div style="opacity:.7">drag the panel over the artwork. scale/edge rebuild the map.</div>
</div>

<div id="panel"><span class="tag">drag me</span></div>
<div id="report">init</div>

<!-- the filter node; the map <feImage> is rebuilt by JS with a generated PNG -->
<svg aria-hidden="true" style="position:absolute;width:0;height:0">
  <defs>
    <filter id="v3-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage id="v3-map" href="" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap id="v3-dm" in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script>
// Generate a radial-lens displacement PNG: exact (128,128) neutral interior,
// 4-fold symmetric by construction, R = x pull, G = y pull, alpha 255.
// Source-position model: inside the flat centre the sample is 1:1; across the
// outer band the sample point is pulled OUTWARD so the rim magnifies/bends.
function buildMapURL(N, edgeFrac){
  const c = document.createElement('canvas'); c.width = c.height = N;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(N, N);
  const d = img.data;
  const edge = edgeFrac;                       // fraction of half-size that is the bend zone
  for (let y = 0; y < N; y++){
    const ny = (y + 0.5) / N * 2 - 1;          // -1..1
    const ay = Math.abs(ny);
    for (let x = 0; x < N; x++){
      const nx = (x + 0.5) / N * 2 - 1;
      const ax = Math.abs(nx);
      // Chebyshev radius: 0 centre, 1 at the square edge — square-symmetric lens
      const r = Math.max(ax, ay);
      let pull = 0;                            // 0 = no shift, 1 = max outward pull
      if (r > 1 - edge){
        const u = (r - (1 - edge)) / edge;     // 0..1 across the rim band
        pull = u * u * (3 - 2 * u);            // smoothstep ramp into the rim
      }
      // pull direction: outward along the dominant axis (Chebyshev), blend at corners
      let dx = 0, dy = 0;
      if (r > 0){
        const w = Math.max(ax, ay);
        dx = (ax === w) ? Math.sign(nx) * pull : 0;
        dy = (ay === w && ax !== w) ? Math.sign(ny) * pull : (ax === w ? Math.sign(ny) * pull * 0 : dy);
        // at exact corners (ax==ay) give half to each -> diagonal bend
        if (Math.abs(ax - ay) < 1e-6){ dx = Math.sign(nx) * pull; dy = Math.sign(ny) * pull; }
      }
      const R = Math.round(128 + dx * 127);
      const G = Math.round(128 + dy * 127);
      const i = (y * N + x) * 4;
      d[i] = R; d[i+1] = G; d[i+2] = 128; d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}

const fe = document.getElementById('v3-map');
const dm = document.getElementById('v3-dm');
const N = 256;
function rebuild(scale, edgePct){
  dm.setAttribute('scale', scale);
  fe.setAttribute('href', buildMapURL(N, edgePct / 100));
}
const scaleEl = document.getElementById('scale'), edgeEl = document.getElementById('edge');
const scaleV = document.getElementById('scalev'), edgeV = document.getElementById('edgev');
function sync(){ scaleV.textContent = scaleEl.value; edgeV.textContent = edgeEl.value; rebuild(+scaleEl.value, +edgeEl.value); report(); }
scaleEl.oninput = sync; edgeEl.oninput = sync;

document.getElementById('mode').onclick = () => document.body.classList.toggle('stripes');

// drag
const panel = document.getElementById('panel');
let drag = null;
panel.addEventListener('pointerdown', e => {
  drag = { dx: e.clientX - panel.offsetLeft, dy: e.clientY - panel.offsetTop };
  panel.setPointerCapture(e.pointerId);
});
panel.addEventListener('pointermove', e => {
  if (!drag) return;
  panel.style.left = (e.clientX - drag.dx) + 'px';
  panel.style.top  = (e.clientY - drag.dy) + 'px';
});
panel.addEventListener('pointerup', () => drag = null);

function report(){
  const cs = getComputedStyle(panel);
  const bf = cs.backdropFilter || cs.webkitBackdropFilter || '(none)';
  document.getElementById('report').textContent =
    'Chrome ' + (navigator.userAgent.match(/Chrom(?:e|ium)\/(\d+)/)||[])[1] +
    ' | url in computed: ' + /url\(/.test(bf) +
    ' | scale ' + dm.getAttribute('scale') + ' | edge ' + edgeEl.value + '%';
}
sync();
</script>
</body>
</html>
