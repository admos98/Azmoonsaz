name: gate

# Runs the full quality gate on every PR and every push to main.
# Compute runs on GitHub-hosted runners — zero Vercel Hobby quota consumed.
# The art gate installs its own python deps (pillow, numpy); if that step
# ever fails the gate fails loudly rather than skipping silently.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (art gate)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install art-gate deps
        run: pip install pillow numpy

      - name: Install dependencies
        run: npm ci

      - name: Run gate
        run: npm run gate
